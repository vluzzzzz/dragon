<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · Dune Dragon</title>
  <style>
    :root { --bg:#0f1115; --panel:#191c22; --panel2:#21252e; --line:#2c313c; --txt:#e7ebf2; --mut:#9aa6b5; --accent:#38bdf8; --accent2:#0ea5e9; --ok:#22c55e; --danger:#ef4444; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,'Segoe UI',sans-serif; background:var(--bg); color:var(--txt); font-size:14px; }
    .hidden { display:none !important; }
    a { color:var(--accent); }
    h1,h2,h3 { margin:0 0 12px; }
    .mut { color:var(--mut); }
    button { font-family:inherit; cursor:pointer; border:none; border-radius:8px; padding:9px 14px; font-size:13px; font-weight:600; }
    .btn { background:var(--accent); color:#04222e; }
    .btn:hover { background:var(--accent2); }
    .btn-ghost { background:var(--panel2); color:var(--txt); border:1px solid var(--line); }
    .btn-ghost:hover { border-color:var(--accent); }
    .btn-danger { background:transparent; color:var(--danger); border:1px solid var(--danger); }
    .btn-sm { padding:6px 10px; font-size:12px; }
    input, select, textarea { width:100%; background:var(--bg); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-size:13px; font-family:inherit; }
    input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); }
    label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); margin:0 0 5px; font-weight:700; }
    .field { margin-bottom:12px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; }
    .row > * { flex:1; min-width:0; }

    /* Login */
    #login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    #login .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:30px; width:100%; max-width:360px; }
    #login h1 { font-size:22px; }

    /* App */
    .topbar { position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 20px; background:var(--panel); border-bottom:1px solid var(--line); }
    .topbar b { font-size:16px; }
    .tabs { display:flex; gap:6px; padding:14px 20px 0; flex-wrap:wrap; }
    .tab { background:var(--panel2); color:var(--mut); border:1px solid var(--line); border-radius:999px; padding:8px 16px; font-weight:600; }
    .tab.active { background:var(--accent); color:#04222e; border-color:var(--accent); }
    .wrap { max-width:980px; margin:0 auto; padding:18px 20px 80px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
    .panel h3 { font-size:15px; }
    .item { background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
    .item-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
    .badge { font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--ok); color:#042; }
    .thumb { width:64px; height:64px; border-radius:10px; object-fit:contain; background:#0a0c10; border:1px solid var(--line); }
    .upload-row { display:flex; align-items:center; gap:10px; }
    .collapse-h { cursor:pointer; user-select:none; color:var(--accent); font-size:12px; font-weight:700; margin:4px 0; }
    .sublist-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
    .sublist-row > input { flex:1; }
    .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ok); color:#042; font-weight:700; padding:11px 20px; border-radius:10px; z-index:100; box-shadow:0 8px 30px rgba(0,0,0,.4); }
    .toast.err { background:var(--danger); color:#fff; }
    .spinner { color:var(--mut); padding:20px; text-align:center; }
  </style>
</head>
<body>
  <!-- No configurado -->
  <div id="notConfigured" class="hidden" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center">
    <div style="max-width:520px">
      <h1>Falta configurar Supabase</h1>
      <p class="mut">Pegá tu <b>SUPABASE_URL</b> y <b>SUPABASE_ANON_KEY</b> en <code>js/supabase-config.js</code> y volvé a cargar. Mientras tanto la web pública funciona normal con el contenido actual.</p>
    </div>
  </div>

  <!-- Login -->
  <div id="login" class="hidden">
    <form class="card" id="loginForm">
      <h1>Admin · Dune Dragon</h1>
      <p class="mut" style="margin-top:-4px">Ingresá para editar el contenido del sitio.</p>
      <div class="field"><label>Email</label><input type="email" id="email" autocomplete="username" required></div>
      <div class="field"><label>Contraseña</label><input type="password" id="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit" style="width:100%" id="loginBtn">Entrar</button>
      <p id="loginErr" class="mut" style="color:#ef4444;margin-bottom:0"></p>
    </form>
  </div>

  <!-- App -->
  <div id="app" class="hidden">
    <div class="topbar">
      <b>Admin · Dune Dragon</b>
      <button class="btn-ghost btn-sm" id="logoutBtn">Cerrar sesión</button>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="content">Títulos</button>
      <button class="tab" data-tab="campaigns">Temporadas (Destacados)</button>
      <button class="tab" data-tab="catalog">Catálogo</button>
    </div>
    <div class="wrap">
      <div id="view-content"></div>
      <div id="view-campaigns" class="hidden"></div>
      <div id="view-catalog" class="hidden"></div>
    </div>
  </div>

  <script type="module" src="./js/admin.js"></script>
</body>
</html>
