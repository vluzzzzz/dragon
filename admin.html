<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · Dune Dragon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#f5f5f7; --card:#fff; --line:rgba(0,0,0,.09); --line2:rgba(0,0,0,.14);
      --txt:#1d1d1f; --mut:#6e6e73; --ink:#111; --ok:#1da34f; --danger:#d70015;
      --shadow:0 4px 20px rgba(0,0,0,.06); --shadow2:0 12px 40px rgba(0,0,0,.10);
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'DM Sans',system-ui,sans-serif; background:var(--bg); color:var(--txt); font-size:14px; -webkit-font-smoothing:antialiased; }
    .hidden { display:none !important; }
    h1,h2,h3 { margin:0; }
    .mut { color:var(--mut); }
    button { font-family:inherit; cursor:pointer; border:none; border-radius:980px; padding:10px 18px; font-size:13px; font-weight:600; transition:all .18s ease; }
    .btn { background:var(--ink); color:#fff; }
    .btn:hover { transform:translateY(-1px); box-shadow:0 6px 18px rgba(0,0,0,.18); }
    .btn-ghost { background:#fff; color:var(--txt); border:1.5px solid var(--line2); }
    .btn-ghost:hover { border-color:var(--ink); }
    .btn-danger { background:#fff; color:var(--danger); border:1.5px solid rgba(215,0,21,.35); }
    .btn-danger:hover { background:var(--danger); color:#fff; }
    .btn-sm { padding:7px 13px; font-size:12px; }
    input, select, textarea { width:100%; background:#fff; color:var(--txt); border:1.5px solid var(--line2); border-radius:12px; padding:11px 13px; font-size:14px; font-family:inherit; transition:border-color .15s; }
    input:focus, select:focus, textarea:focus { outline:none; border-color:var(--ink); }
    textarea { resize:vertical; }
    label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut); margin:0 0 6px; font-weight:700; }
    .field { margin-bottom:14px; }
    .row { display:flex; gap:12px; flex-wrap:wrap; }
    .row > * { flex:1; min-width:0; }

    /* Login */
    #login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    #login .card { background:var(--card); border-radius:24px; padding:38px 34px; width:100%; max-width:380px; box-shadow:var(--shadow2); }
    #login .brand { font-family:'Bebas Neue',sans-serif; font-size:34px; letter-spacing:.01em; line-height:1; }
    #login .sub { color:var(--mut); margin:6px 0 22px; }

    /* Topbar + tabs */
    .topbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 24px; background:rgba(245,245,247,.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
    .topbar .brand { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:.02em; }
    .tabs { display:flex; gap:8px; justify-content:center; padding:18px 20px 4px; flex-wrap:wrap; }
    .tab { background:#fff; color:var(--txt); border:1.5px solid var(--line2); border-radius:980px; padding:9px 20px; font-weight:600; }
    .tab.active { background:var(--ink); color:#fff; border-color:var(--ink); }
    .wrap { max-width:1000px; margin:0 auto; padding:14px 20px 90px; }
    .head { text-align:center; margin:22px 0 8px; }
    .head .eyebrow { font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--mut); }
    .head .title { font-family:'Bebas Neue',sans-serif; font-size:52px; line-height:.95; color:var(--ink); }

    .panel { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; margin-bottom:16px; box-shadow:var(--shadow); }
    .card-item { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; margin-bottom:16px; box-shadow:var(--shadow); }
    .card-item.flash { animation:flash 1.4s ease; }
    @keyframes flash { 0% { box-shadow:0 0 0 3px rgba(29,163,79,.5); } 100% { box-shadow:var(--shadow); } }
    .item-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
    .item-title { font-size:17px; font-weight:700; }
    .badge { font-size:11px; font-weight:700; padding:4px 11px; border-radius:980px; background:var(--ok); color:#fff; letter-spacing:.02em; }
    .pill-mut { font-size:11px; color:var(--mut); background:var(--bg); border:1px solid var(--line); padding:3px 9px; border-radius:980px; }
    .thumb { width:60px; height:60px; border-radius:12px; object-fit:contain; background:var(--bg); border:1px solid var(--line); flex:0 0 auto; }
    .upload-row { display:flex; align-items:center; gap:10px; }
    .upload-row input[type=text] { flex:1; }
    input[type=file] { border:1.5px dashed var(--line2); background:var(--bg); cursor:pointer; padding:9px; font-size:12px; }
    .collapse-h { cursor:pointer; user-select:none; color:var(--ink); font-size:13px; font-weight:700; padding:10px 0 2px; display:inline-flex; align-items:center; gap:6px; }
    .sub { border-top:1px solid var(--line); margin-top:14px; padding-top:14px; }
    .sublist-row { display:flex; gap:8px; align-items:center; margin-bottom:9px; }
    .sublist-row > input { flex:1; }
    .actions-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; align-items:center; }
    .spinner { color:var(--mut); padding:28px; text-align:center; }
    .new-form { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-top:12px; }
    .new-form .field { margin:0; flex:1; min-width:200px; }

    /* Toast Guardado ✓ */
    .toast { position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(8px); display:flex; align-items:center; gap:9px; background:var(--ok); color:#fff; font-weight:700; padding:13px 22px 13px 16px; border-radius:980px; z-index:200; box-shadow:0 12px 36px rgba(29,163,79,.4); opacity:0; transition:opacity .25s, transform .25s; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .toast.err { background:var(--danger); box-shadow:0 12px 36px rgba(215,0,21,.4); }
    .toast .check { width:24px; height:24px; border-radius:50%; background:rgba(255,255,255,.22); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
    .toast .check svg { width:15px; height:15px; }
  </style>
</head>
<body>
  <div id="notConfigured" class="hidden" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center">
    <div style="max-width:520px">
      <h1 style="font-family:'Bebas Neue',sans-serif;font-size:40px">Falta configurar Supabase</h1>
      <p class="mut">Pegá tu <b>SUPABASE_URL</b> y <b>SUPABASE_ANON_KEY</b> en <code>js/supabase-config.js</code> y recargá.</p>
    </div>
  </div>

  <div id="login" class="hidden">
    <form class="card" id="loginForm">
      <div class="brand">Dune Dragon</div>
      <p class="sub">Panel de administración</p>
      <div class="field"><label>Email</label><input type="email" id="email" autocomplete="username" required></div>
      <div class="field"><label>Contraseña</label><input type="password" id="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit" style="width:100%;border-radius:14px" id="loginBtn">Entrar</button>
      <p id="loginErr" style="color:var(--danger);margin:12px 0 0;font-size:13px"></p>
    </form>
  </div>

  <div id="app" class="hidden">
    <div class="topbar">
      <span class="brand">Dune Dragon · Admin</span>
      <button class="btn-ghost btn-sm" id="logoutBtn">Cerrar sesión</button>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="campaigns">Temporadas</button>
      <button class="tab" data-tab="catalog">Catálogo</button>
    </div>
    <div class="wrap">
      <div id="view-campaigns"></div>
      <div id="view-catalog" class="hidden"></div>
    </div>
  </div>

  <script type="module" src="./js/admin.js"></script>
</body>
</html>
